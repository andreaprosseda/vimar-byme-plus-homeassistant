name: "Validate & Release"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  

  ##################
  # lint with ruff #
  ##################
  

  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        - name: "Set up Python"
          uses: actions/setup-python@v5.3.0
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install Ruff"
          run: pip install ruff

        - name: "Lint"
          run: python3 -m ruff check .

        - name: "Format"
          run: python3 -m ruff format . --check


  ################################
  # validate for hassfest & hacs #
  ################################


  hassfest: # https://github.com/home-assistant/actions#hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"


  ###############################
  # suite di test (tests/ in radice) #
  ###############################


  tests:
    name: "Tests"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        # 3.13 e non 3.14 (usata altrove in questo workflow), e di proposito:
        # requirements.txt pinna homeassistant==2026.6.0, che oggi richiede
        # Python >=3.14.2, ma pytest-homeassistant-custom-component (che
        # serve solo qui, a test_setup.py) porta con se' l'ultima versione di
        # homeassistant che CONOSCE — al momento in cui questo job e' stato
        # scritto, 2026.2.3, che vuole 3.13. requirements-test.txt lo
        # spiega meglio e non forza il pin di runtime sopra quello del
        # plugin. Quando esce una versione del plugin allineata a una
        # homeassistant piu' recente, alza anche questa.
        - name: "Set up Python"
          uses: actions/setup-python@v5.3.0
          with:
            python-version: "3.13"
            cache: "pip"

        - name: "Install test requirements"
          run: pip install -r requirements-test.txt

        # Il master.db committato deve corrispondere al generatore: se
        # qualcuno modifica i casi d'uso e dimentica di rigenerare, il diff
        # qui sotto lo ferma prima che gli snapshot mentano.
        - name: "Check fixture is up to date"
          run: |
            python3 tests/build_master_db.py
            git diff --exit-code --stat tests/fixtures/master.db

        - name: "Run tests"
          run: python3 -m pytest tests/ -v


  #######################
  # release new version #
  #######################


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ruff
      - hassfest
      - hacs
      - tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: "actions/checkout@v4.2.2"

      - name: Read version from manifest.json
        id: manifest
        run: |
          RAW_VERSION=$(jq -r '.version' custom_components/vimar_byme_plus/manifest.json)
          VERSION="v$RAW_VERSION"
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.manifest.outputs.version }}"
          echo "Checking if release $VERSION already exists..."
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release check result
        run: |
          echo "Release exists: ${{ steps.check_release.outputs.exists }}"

      - name: ZIP the integration directory
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "Zipping the integration..."
          cd "${{ github.workspace }}/custom_components/vimar_byme_plus"
          zip vimar-byme-plus.zip -r ./

      - name: Create GitHub Release and upload ZIP
        if: steps.check_release.outputs.exists == 'false'
        uses: "softprops/action-gh-release@v2.0.9"
        with:
          tag_name: ${{ steps.manifest.outputs.version }}
          name: ${{ steps.manifest.outputs.version }}
          files: ${{ github.workspace }}/custom_components/vimar_byme_plus/vimar-byme-plus.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}