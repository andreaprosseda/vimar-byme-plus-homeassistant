name: "Validate & Release"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  

  ##################
  # lint with ruff #
  ##################
  

  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        - name: "Set up Python"
          uses: actions/setup-python@v5.3.0
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install Ruff"
          run: pip install ruff

        - name: "Lint"
          run: python3 -m ruff check .

        - name: "Format"
          run: python3 -m ruff format . --check


  ################################
  # validate for hassfest & hacs #
  ################################


  hassfest: # https://github.com/home-assistant/actions#hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

  hacs: # https://github.com/hacs/action
    name: "HACS Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        - name: "Run HACS validation"
          uses: "hacs/action@main"
          with:
            category: "integration"


  ###############################
  # test suite (tests/ in radice) #
  ###############################


  tests:
    name: "Tests"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.2.2"

        # Python 3.14: e' cio' che richiede lo stack di test moderno.
        # requirements-test.txt lascia flottare pytest-homeassistant-custom-
        # component all'ultima versione, che porta con se' la homeassistant
        # con cui e' stata verificata (2026.9.1 al momento in cui questo job
        # e' stato scritto); quella homeassistant richiede Python >=3.14.2.
        # La suite e' stata verificata proprio su questa combinazione.
        - name: "Set up Python"
          uses: actions/setup-python@v5.3.0
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install test requirements"
          run: pip install -r requirements-test.txt

        # Il master.db si rigenera qui invece di confrontarne i BYTE con quello
        # committato: il formato binario del file dipende dalla versione di
        # SQLite bundlata con Python, quindi un byte-diff darebbe falsi
        # positivi. La deriva che conta — il generatore cambiato senza
        # aggiornare gli snapshot — la coglie test_snapshot.py, che confronta
        # il CONTENUTO delle entita', non i byte del database.
        - name: "Regenerate the fixture database"
          run: python3 tests/build_master_db.py

        - name: "Run tests"
          run: python3 -m pytest tests/ -v


  #######################
  # release new version #
  #######################


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - ruff
      - hassfest
      - hacs
      - tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: "actions/checkout@v4.2.2"

      - name: Read version from manifest.json
        id: manifest
        run: |
          RAW_VERSION=$(jq -r '.version' custom_components/vimar_byme_plus/manifest.json)
          VERSION="v$RAW_VERSION"
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.manifest.outputs.version }}"
          echo "Checking if release $VERSION already exists..."
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release check result
        run: |
          echo "Release exists: ${{ steps.check_release.outputs.exists }}"

      - name: ZIP the integration directory
        if: steps.check_release.outputs.exists == 'false'
        run: |
          echo "Zipping the integration..."
          cd "${{ github.workspace }}/custom_components/vimar_byme_plus"
          zip vimar-byme-plus.zip -r ./

      - name: Create GitHub Release and upload ZIP
        if: steps.check_release.outputs.exists == 'false'
        uses: "softprops/action-gh-release@v2.0.9"
        with:
          tag_name: ${{ steps.manifest.outputs.version }}
          name: ${{ steps.manifest.outputs.version }}
          files: ${{ github.workspace }}/custom_components/vimar_byme_plus/vimar-byme-plus.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}