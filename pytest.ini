[pytest]
testpaths = tests
addopts = -q
asyncio_mode = auto
# Nessun test qui deve toccare la rete: pytest-socket (arrivato con
# pytest-homeassistant-custom-component) lo fa rispettare da solo. Se un
# giorno un test prova ad aprire un socket vero verso un gateway, fallisce
# con un errore chiaro invece di restare appeso.
